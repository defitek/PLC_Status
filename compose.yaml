services:
  plc-status:
    build: .
    container_name: plc-commissioning-hub
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/plc-status.db
      APP_USER: ${APP_USER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - plc_status_data:/app/data

volumes:
  plc_status_data:
