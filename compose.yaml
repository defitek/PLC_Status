services:
  plc-status:
    build: .
    container_name: plc-commissioning-hub
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/plc-status.db
      APP_USER: ${APP_USER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      REDIS_URL: redis://redis:6379
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_DATA_LIMIT: ${DEMO_DATA_LIMIT:-100}
    volumes:
      - plc_status_data:/app/data
    depends_on:
      - redis

  redis:
    image: public.ecr.aws/docker/library/redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - plc_status_redis:/data

volumes:
  plc_status_data:
  plc_status_redis:
