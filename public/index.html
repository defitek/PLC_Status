<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>PLC Commissioning Hub</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head><body>
<header class="topbar"><div class="logo">PLC</div><div class="brand"><strong>Commissioning Hub</strong><span>Project status & team workspace</span></div><div class="userbox"><span id="me"></span><button id="logout" class="ghost">Wyloguj</button></div></header>
<div class="layout"><aside><label class="select-label">Sterownik<select id="controller"><option value="all">Wszystkie sterowniki</option></select></label><nav id="nav">
<button data-view="status" class="active">▦ <span>Status</span><b id="n-status">0</b></button><button data-view="tasks">✓ <span>Zadania</span><b id="n-tasks">0</b></button><button data-view="goals">◎ <span>Cele</span><b id="n-goals">0</b></button><button data-view="points">! <span>Otwarte punkty</span><b id="n-points">0</b></button><button data-view="notes">▤ <span>Dzienne notatki</span><b id="n-notes">0</b></button><button data-view="settings" id="settings-nav">⚙ <span>Konfiguracja</span></button></nav></aside>
<main><header class="pagehead"><div><h1 id="title">Status</h1><p id="desc"></p></div><button id="add" class="primary">+ Dodaj</button></header><section id="content"><div class="loading">Ładowanie…</div></section></main></div>
<dialog id="modal"><form id="form"><header><div><h2 id="modal-title"></h2><p id="modal-subtitle"></p></div><button type="button" class="x" id="close">×</button></header><div id="fields" class="formgrid"></div><footer><button type="button" id="remove" class="danger">Usuń</button><span></span><button type="button" id="cancel" class="secondary">Anuluj</button><button class="primary">Zapisz</button></footer></form></dialog>
<div id="toast" class="toast"></div><datalist id="people"></datalist></body></html>
