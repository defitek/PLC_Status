<!doctype html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Logowanie · PLC Commissioning Hub</title>
  <link rel="stylesheet" href="/styles.css?v=1.0.0">
  <script type="module" src="/login.js?v=1.0.0"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-logo logo-mark" aria-label="Commissioning Hub">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path class="logo-network" d="M8 14h11M45 14h11M8 27h11M45 27h11"/><circle class="logo-node" cx="6" cy="14" r="3"/><circle class="logo-node" cx="58" cy="14" r="3"/><circle class="logo-node" cx="6" cy="27" r="3"/><circle class="logo-node" cx="58" cy="27" r="3"/><rect class="logo-plc" x="19" y="6" width="26" height="28" rx="4"/><path class="logo-plc-lines" d="M28 7v26M36 7v26"/><circle class="logo-led" cx="23.5" cy="11" r="1.8"/><path class="logo-car" d="M13 49h4l5-9h20l5 9h4l4 4v5h-6l-3-3H18l-3 3H9v-5zM19 49h26l-5-6H24z"/></svg>
    </div>
    <h1>Commissioning Hub</h1>
    <p id="login-description">Zaloguj się, a następnie wybierz dostępny projekt</p>
    <form id="login">
      <div id="password-step">
        <label>Login<input name="username" autocomplete="username" maxlength="100" required autofocus></label>
        <label>Hasło<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
      </div>
      <div id="mfa-step" class="hidden">
        <label>Kod MFA lub kod awaryjny<input name="code" inputmode="text" autocomplete="one-time-code" maxlength="12"></label>
        <button type="button" class="secondary" id="mfa-back">Wróć do logowania hasłem</button>
      </div>
      <div id="login-error" class="login-error" role="alert"></div>
      <button class="primary" id="login-submit">Zaloguj</button>
    </form>
    <p class="login-credit">Marcin Defitowski <b>@ AI</b></p>
  </main>
</body>
</html>
